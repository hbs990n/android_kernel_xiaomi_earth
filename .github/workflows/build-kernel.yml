# ============================================================================
# Build earth (Redmi 12C / MT6768) kernel with KernelSU-Next via GitHub Actions
#
# 用法（交接文档 §4）：
#   - 把本文件放在内核仓库根目录的 .github/workflows/ 下，推到 GitHub 后
#     在 Actions 页面手动触发（workflow_dispatch）。
#   - 首次运行强制全量、干净构建（全新 checkout），并用 make -k 一次性
#     暴露所有编译错误；完整构建日志上传为 artifact 供排错迭代。
#
# 产物（artifact）：
#   - Image.gz-dtb  内核 + mt6768 设备树（刷 boot_b）
#   - earth.dtbo    dtbo 覆盖层（刷 dtbo_b）
#   - build.log     完整构建日志
#   - AnyKernel3 zip（可选，自动打，刷 boot 用，自动处理 A/B 槽）
#
# 触发方式：仅 workflow_dispatch（手动），不会被 push/PR 自动触发。
# ============================================================================
name: Build earth Kernel

on:
  workflow_dispatch:
    inputs:
      clang_version:
        description: 'LLVM/Clang 主版本（15 或 17，与 4.19 内核兼容）'
        required: false
        default: '17'
        type: choice
        options:
          - '15'
          - '17'
      keep_going:
        description: '使用 make -k 继续编译，一次性输出所有错误（排错模式）'
        required: false
        default: true
        type: boolean

# 手动触发；同一时间只跑一个构建
concurrency:
  group: build-kernel
  cancel-in-progress: true

jobs:
  build:
    name: Build earth kernel (4.19.325 / MT6768 / KSU-Next)
    runs-on: ubuntu-24.04

    steps:
      # ------------------------------------------------------------------
      # 1. 拉取源码（完整历史，供 KernelSU-Next 计算 KSU_VERSION）
      # ------------------------------------------------------------------
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------------
      # 2. 安装工具链（与社区验证过的 earth 构建环境一致）：
      #    clang/lld/llvm + aarch64 GCC 交叉编译（LLVM 为主，GCC 兜底）
      # ------------------------------------------------------------------
      - name: Install toolchain
        run: |
          CLANG_MAJOR="${{ inputs.clang_version }}"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang-${CLANG_MAJOR} lld-${CLANG_MAJOR} llvm-${CLANG_MAJOR} \
            gcc-aarch64-linux-gnu \
            bc bison flex make \
            libssl-dev libelf-dev libyaml-dev \
            device-tree-compiler cpio kmod \
            zip unzip python3
          # 让 clang/ld.lld/llvm-* 优先命中所选版本
          echo "/usr/lib/llvm-${CLANG_MAJOR}/bin" >> "$GITHUB_PATH"
          echo "clang: $(/usr/lib/llvm-${CLANG_MAJOR}/bin/clang --version | head -1)"

      # ------------------------------------------------------------------
      # 3. （可选）应用用户放在 patches/ 下的修复补丁，方便迭代
      # ------------------------------------------------------------------
      - name: Apply user patches (optional)
        run: |
          if [ -d patches ] && ls patches/*.patch >/dev/null 2>&1; then
            for p in $(ls patches/*.patch | sort); do
              echo "Applying $p"
              git apply --verbose "$p"
            done
          else
            echo "No patches/ directory found, skipping"
          fi

      # ------------------------------------------------------------------
      # 4. 修正 defconfig：
      #    内核自带 KernelSU，但其 Kconfig depends on OVERLAY_FS，
      #    而 earth_defconfig 里没有 OVERLAY_FS -> 补上，否则 KSU 不生效。
      # ------------------------------------------------------------------
      - name: Patch defconfig (enable OVERLAY_FS for KernelSU)
        run: |
          scripts/config --file arch/arm64/configs/earth_defconfig -e OVERLAY_FS
          echo "--- earth_defconfig 中 OVERLAY_FS / KSU 相关："
          grep -E 'CONFIG_OVERLAY_FS|CONFIG_KSU' arch/arm64/configs/earth_defconfig || true

      # ------------------------------------------------------------------
      # 5. 生成 .config（earth_defconfig）
      # ------------------------------------------------------------------
      - name: Generate defconfig
        run: |
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            earth_defconfig

      - name: Verify KernelSU is enabled
        run: |
          echo "--- out/.config 中 KSU / OVERLAY_FS："
          grep -E '^CONFIG_KSU=|^CONFIG_OVERLAY_FS=' out/.config
          if ! grep -q '^CONFIG_KSU=y' out/.config; then
            echo "::error::CONFIG_KSU 未启用，检查 OVERLAY_FS 配置"
            exit 1
          fi

      # ------------------------------------------------------------------
      # 6. 全量编译内核（-k 模式一次性暴露全部错误）
      #    earth.dtbo 不用单独指定目标：make Image.gz-dtb 会经其依赖 dtbs
      #    自动编出 earth.dtbo（arch/arm64/boot/dts/mediatek/Makefile 的
      #    dtb-y += earth.dtbo）。单独 make .../earth.dtbo 反而会失败。
      #    产物：
      #      out/arch/arm64/boot/Image.gz-dtb   （内核 + mt6768 dtb）
      #      out/arch/arm64/boot/dts/mediatek/earth.dtbo（dtbo 覆盖层）
      # ------------------------------------------------------------------
      - name: Build kernel (Image.gz-dtb + earth.dtbo via dtbs)
        run: |
          KEEP=""
          if [ "${{ inputs.keep_going }}" == "true" ]; then KEEP="-k"; fi
          set +e
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            $KEEP -j"$(nproc)" \
            Image.gz-dtb \
            2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "build_exit=$rc" >> "$GITHUB_ENV"
          echo "make exit code: $rc"
          echo "error-line count: $(grep -c 'error:' build.log || true)"

      # ------------------------------------------------------------------
      # 7. （可选）AnyKernel3 打包刷机 zip（自动处理 A/B 槽 + 禁 AVB 校验）
      # ------------------------------------------------------------------
      - name: Package AnyKernel3 zip (optional)
        if: always()
        run: |
          set -e
          IMG=out/arch/arm64/boot/Image.gz-dtb
          if [ ! -f "$IMG" ]; then
            echo "Image.gz-dtb 不存在，跳过打包"
            exit 0
          fi
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3 -b master ak3 2>/dev/null \
            || { echo "::warning::AnyKernel3 下载失败，跳过打包（内核产物不受影响）"; exit 0; }
          cp "$IMG" ak3/Image.gz-dtb
          printf '%s\n' \
            '### AnyKernel3 Ramdisk Mod Script' \
            '## for Xiaomi Redmi 12C / Poco C55 (earth, MT6768) - A/B slot device' \
            '' \
            '# boot shell variables' \
            'BLOCK=auto;' \
            'IS_SLOT_DEVICE=auto;' \
            'RAMDISK_COMPRESSION=auto;' \
            'PATCH_VBMETA_FLAG=auto;' \
            '' \
            '# import functions/variables and setup patching - see for reference (DO NOT REMOVE)' \
            '. tools/ak3-core.sh;' \
            '' \
            '# boot install' \
            'dump_boot;' \
            'write_boot;' \
            '## end boot install' \
            > ak3/anykernel.sh
          (cd ak3 && zip -r9 ../AnyKernel3-earth.zip . -x '*.git*' '*.github*')
          unzip -t AnyKernel3-earth.zip >/dev/null
          echo "Packaged: $(ls -lh AnyKernel3-earth.zip | awk '{print $5, $9}')"

      # ------------------------------------------------------------------
      # 8. 上传 artifact（无论成败都传，方便拿日志排错）
      # ------------------------------------------------------------------
      - name: Upload kernel artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earth-kernel-artifacts
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dts/mediatek/earth.dtbo
            out/**/earth.dtbo
            build.log
            AnyKernel3-earth.zip
          retention-days: 7

      # ------------------------------------------------------------------
      # 9. 结果判定：内核没出 / 编译有错误 -> 红色失败，并在日志里打印
      #    错误摘要与 build.log 尾部（不下载也能直接看到报错）
      # ------------------------------------------------------------------
      - name: Check build result
        if: always()
        run: |
          rc="${{ env.build_exit }}"
          DTBO="$(find out -name earth.dtbo 2>/dev/null | head -1 || true)"
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "== 产物 =="
            ls -lh out/arch/arm64/boot/Image.gz-dtb 2>/dev/null || true
            [ -n "$DTBO" ] && ls -lh "$DTBO" || true
            echo "== Image.gz-dtb 已验证存在 =="
          else
            echo "::error::Image.gz-dtb 未生成（构建失败）"
            rc=1
          fi
          if [ -z "$DTBO" ]; then
            echo "::error::earth.dtbo 未生成（构建失败）"
            rc=1
          fi
          if [ "${rc:-1}" != "0" ]; then
            echo "::error::make 返回非零（build.log 已上传 artifact）"
            echo "===== build.log 错误摘要（前 200 行）====="
            grep -nE 'error:|fatal error|undefined reference|Error [0-9]+' build.log \
              | head -200 || true
            echo "===== build.log 末尾 200 行 ====="
            tail -n 200 build.log || true
            exit 1
          fi
          echo "::notice::构建成功：Image.gz-dtb + earth.dtbo + AnyKernel3 zip 已上传 artifact"
